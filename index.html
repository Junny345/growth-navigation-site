 'use strict';
 const payload=JSON.parse(document.getElementById('gate-payload').textContent),form=document.getElementById('gate-form'),input=document.getElementById('gate-password'),button=document.getElementById('gate-submit'),status=document.getElementById('gate-status');
 const cacheName='growth-navigation.encrypted-session.v1',lockName='growth-navigation.lock-marker.v1';
 const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),encode=bytes=>btoa(String.fromCharCode(...bytes));
 let busy=false;
 function cacheRead(){try{return JSON.parse(sessionStorage.getItem(cacheName)||'null');}catch(e){return null;}}
 function forget(){try{sessionStorage.removeItem(cacheName);}catch(e){}}
 async function openWithRawKey(raw,remember){
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:new TextEncoder().encode('growth-navigation-v1'),tagLength:128},key,decode(payload.ciphertext));
  if(remember){try{sessionStorage.setItem(cacheName,JSON.stringify({id:payload.id,key:encode(raw)}));}catch(e){/* Reading remains available; browser refused session persistence. */}}
  else forget();
  input.value='';let marker='';try{marker=sessionStorage.getItem(lockName)||'';}catch(e){}
  const html=new TextDecoder('utf-8',{fatal:true}).decode(clear);
  if(document.readyState!=='complete')await new Promise(resolve=>window.addEventListener('load',resolve,{once:true}));
  document.open();document.write(html);document.close();
  window.familyLockSite=()=>{forget();try{sessionStorage.setItem(lockName,String(Date.now())+Math.random());}catch(e){}location.reload();};
  window.addEventListener('pageshow',event=>{if(event.persisted){try{if((sessionStorage.getItem(lockName)||'')!==marker)location.reload();}catch(e){location.reload();}}});
 }
 function supported(){if(!window.isSecureContext||!window.crypto?.subtle){status.textContent='请使用HTTPS安全网址，在系统浏览器打开此页面。';button.disabled=true;return false;}return true;}
 form.addEventListener('submit',async event=>{
  event.preventDefault();if(busy||!supported())return;const password=input.value.trim();if(!password)return;
  busy=true;button.disabled=true;button.textContent='正在解锁…';status.textContent='';
  try{
   const source=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
   const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},source,256);
   await openWithRawKey(new Uint8Array(bits),document.getElementById('gate-remember').checked);
  }catch(e){forget();status.textContent='未能解锁，请检查口令后重试。';input.focus();}
  finally{busy=false;if(document.getElementById('gate-submit')){button.disabled=false;button.textContent='解锁家庭空间 →';}}
 });
 document.getElementById('gate-show').addEventListener('click',event=>{const show=input.type==='password';input.type=show?'text':'password';event.currentTarget.textContent=show?'隐藏':'显示';event.currentTarget.setAttribute('aria-label',show?'隐藏口令':'显示口令');event.currentTarget.setAttribute('aria-pressed',String(show));});
 if(supported()){
  const saved=cacheRead();if(saved?.id===payload.id&&typeof saved.key==='string'&&saved.key.length<100){
   button.disabled=true;button.textContent='正在打开家庭空间…';
   Promise.resolve().then(()=>openWithRawKey(decode(saved.key),true)).catch(()=>{forget();button.disabled=false;button.textContent='解锁家庭空间 →';status.textContent='会话已失效，请重新输入口令。';});
  }
 }
})();
</script></body></html>
